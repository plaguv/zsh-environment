[env]
REGISTRY_AUTH_FILE = "{{ env.XDG_CONFIG_HOME }}/containers/auth.json"
PODMAN_COMPOSE_PROVIDER = "podman-compose"

_.source = "{{env.XDG_CONFIG_HOME}}/mise/scripts/podman-env.sh"

[bootstrap.packages]
"apt:podman" = { os = "linux" }
"apt:podman-compose" = { os = "linux" }
"brew:podman" = { os = "macos" }
"brew:podman-compose" = { os = "macos" }
